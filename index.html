<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: var(--color-background-primary);
    --bg2: var(--color-background-secondary);
    --bg3: var(--color-background-tertiary);
    --text: var(--color-text-primary);
    --muted: var(--color-text-secondary);
    --hint: var(--color-text-tertiary);
    --border: var(--color-border-tertiary);
    --border2: var(--color-border-secondary);
    --rad: var(--border-radius-md);
    --rad-lg: var(--border-radius-lg);
    --aws-orange: #FF9900;
    --aws-dark: #232F3E;
    --cost-trap: #E24B4A;
    --cost-champ: #1D9E75;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    color: var(--text);
    background: transparent;
    font-size: 14px;
    line-height: 1.6;
  }

  .hero {
    background: var(--aws-dark);
    border-radius: var(--rad-lg);
    padding: 24px 28px 20px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: #FF9900;
    opacity: 0.08;
  }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,153,0,0.15);
    border: 0.5px solid rgba(255,153,0,0.4);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 11px;
    color: #FF9900;
    font-weight: 500;
    margin-bottom: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .hero h1 {
    font-family: 'Syne', var(--font-sans);
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .hero p {
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    max-width: 540px;
  }
  .hero-stats {
    display: flex;
    gap: 16px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .hero-stat {
    background: rgba(255,255,255,0.07);
    border-radius: var(--rad);
    padding: 8px 14px;
    font-size: 12px;
    color: rgba(255,255,255,0.75);
  }
  .hero-stat strong {
    color: #FF9900;
    font-weight: 600;
    display: block;
    font-size: 18px;
  }

  .toc-section {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--rad-lg);
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .toc-section h2 {
    font-family: 'Syne', var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .toc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 6px;
  }
  .toc-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 10px;
    border-radius: var(--rad);
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    border: 0.5px solid transparent;
    transition: all 0.15s;
  }
  .toc-item:hover {
    background: var(--bg3);
    border-color: var(--border2);
    color: var(--text);
  }
  .toc-num {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--aws-orange);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .filter-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 5px 12px;
    border-radius: 20px;
    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-family: var(--font-sans);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--aws-dark);
    color: #FF9900;
    border-color: rgba(255,153,0,0.4);
  }

  .search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg2);
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    padding: 8px 14px;
    margin-bottom: 14px;
  }
  .search-bar input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    font-family: var(--font-sans);
    outline: none;
  }
  .search-bar input::placeholder { color: var(--hint); }

  .category-block { margin-bottom: 28px; }
  .cat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 0.5px solid var(--border);
  }
  .cat-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--aws-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .cat-title {
    font-family: 'Syne', var(--font-sans);
    font-size: 16px;
    font-weight: 700;
  }
  .cat-count {
    margin-left: auto;
    font-size: 11px;
    color: var(--hint);
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: 20px;
    padding: 2px 8px;
  }

  .service-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--rad-lg);
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .service-card:hover { border-color: var(--border2); }

  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }
  .card-header:hover { background: var(--bg2); }

  .svc-name {
    font-family: 'Syne', var(--font-sans);
    font-weight: 700;
    font-size: 15px;
    flex: 1;
  }
  .svc-sub {
    font-size: 12px;
    color: var(--muted);
    display: block;
    font-weight: 400;
    font-family: var(--font-sans);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .badge-trap {
    background: rgba(226,75,74,0.12);
    color: #E24B4A;
    border: 0.5px solid rgba(226,75,74,0.3);
  }
  .badge-champ {
    background: rgba(29,158,117,0.12);
    color: #1D9E75;
    border: 0.5px solid rgba(29,158,117,0.3);
  }

  .chevron {
    width: 18px; height: 18px;
    color: var(--hint);
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .card-header.open .chevron { transform: rotate(90deg); }

  .card-body {
    display: none;
    padding: 0 16px 16px;
    border-top: 0.5px solid var(--border);
  }
  .card-body.open { display: block; }

  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 14px;
    border-bottom: 0.5px solid var(--border);
    margin-top: 14px;
  }
  .tab {
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -0.5px;
    transition: all 0.15s;
  }
  .tab.active {
    color: var(--aws-orange);
    border-bottom-color: var(--aws-orange);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .what-box {
    background: var(--bg2);
    border-radius: var(--rad);
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .scenario-box {
    background: var(--bg2);
    border-left: 3px solid var(--aws-orange);
    border-radius: 0 var(--rad) var(--rad) 0;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 8px;
  }
  .scenario-box strong { color: var(--aws-orange); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 4px; }

  .arch-flow {
    background: var(--aws-dark);
    border-radius: var(--rad);
    padding: 12px 14px;
    font-family: 'JetBrains Mono', var(--font-mono);
    font-size: 11px;
    color: rgba(255,255,255,0.75);
    line-height: 1.8;
    margin-bottom: 2px;
    overflow-x: auto;
    white-space: pre;
  }
  .arch-flow .hl { color: #FF9900; }
  .arch-flow .grn { color: #5DCAA5; }
  .arch-flow .blu { color: #85B7EB; }

  .cost-tips { list-style: none; }
  .cost-tips li {
    display: flex;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 0.5px solid var(--border);
    font-size: 13px;
    line-height: 1.6;
  }
  .cost-tips li:last-child { border-bottom: none; }
  .cost-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(255,153,0,0.15);
    border: 0.5px solid rgba(255,153,0,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    color: var(--aws-orange);
    flex-shrink: 0;
    margin-top: 1px;
    font-weight: 700;
  }

  .alt-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .alt-table th {
    text-align: left;
    padding: 6px 10px;
    background: var(--bg2);
    color: var(--muted);
    font-weight: 500;
    font-size: 11px;
    border-bottom: 0.5px solid var(--border);
  }
  .alt-table th:first-child { border-radius: var(--rad) 0 0 0; }
  .alt-table th:last-child { border-radius: 0 var(--rad) 0 0; }
  .alt-table td {
    padding: 7px 10px;
    border-bottom: 0.5px solid var(--border);
    vertical-align: top;
    line-height: 1.5;
  }
  .alt-table tr:last-child td { border-bottom: none; }
  .alt-table .svc-tag {
    display: inline-block;
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: 'JetBrains Mono', var(--font-mono);
    font-size: 11px;
    color: var(--aws-orange);
    font-weight: 600;
  }
  .cheaper { color: #1D9E75; font-size: 11px; font-weight: 600; }
  .pricier { color: #E24B4A; font-size: 11px; font-weight: 600; }
  .same { color: var(--muted); font-size: 11px; font-weight: 600; }

  /* Cost Cheat Sheet */
  .cheat-section {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--rad-lg);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .cheat-header {
    background: var(--aws-dark);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cheat-header h3 {
    font-family: 'Syne', var(--font-sans);
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    flex: 1;
  }
  .cheat-body { padding: 16px 18px; }

  .decision-matrix { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
  .decision-matrix th {
    background: var(--bg2);
    padding: 8px 10px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    border-bottom: 0.5px solid var(--border);
  }
  .decision-matrix td {
    padding: 8px 10px;
    border-bottom: 0.5px solid var(--border);
    vertical-align: top;
    line-height: 1.5;
    font-size: 12px;
  }
  .decision-matrix tr:last-child td { border-bottom: none; }
  .type-od { color: #E24B4A; font-weight: 600; }
  .type-ri { color: #1D9E75; font-weight: 600; }
  .type-sp { color: #FF9900; font-weight: 600; }

  /* Quick decision framework */
  .flow-wrap {
    background: var(--aws-dark);
    border-radius: var(--rad-lg);
    padding: 20px;
    font-family: 'JetBrains Mono', var(--font-mono);
    font-size: 11px;
    color: rgba(255,255,255,0.75);
    line-height: 2;
    overflow-x: auto;
    white-space: pre;
    margin-bottom: 20px;
  }
  .flow-wrap .q  { color: #85B7EB; }
  .flow-wrap .a  { color: #5DCAA5; }
  .flow-wrap .svc { color: #FF9900; font-weight: 700; }
  .flow-wrap .hr { color: rgba(255,255,255,0.2); }

  .overlap-box {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--rad-lg);
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .overlap-box h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--aws-orange);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .overlap-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .overlap-item {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--rad);
    padding: 10px 12px;
  }
  .overlap-item h4 { font-size: 12px; font-weight: 600; color: var(--aws-orange); margin-bottom: 4px; }
  .overlap-item p { font-size: 11px; color: var(--muted); line-height: 1.5; }

  .sticky-nav {
    position: sticky;
    top: 0;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 0.5px solid var(--border);
    padding: 8px 0 8px;
    z-index: 100;
    margin-bottom: 16px;
  }
  @media (prefers-color-scheme: dark) {
    .sticky-nav { background: rgba(30,30,30,0.95); }
  }

  .jump-bar {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .jump-btn {
    padding: 3px 8px;
    border-radius: 4px;
    border: 0.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 10px;
    font-family: var(--font-sans);
    cursor: pointer;
    font-weight: 500;
    transition: all 0.12s;
  }
  .jump-btn:hover { background: var(--bg2); color: var(--text); }

  .section-anchor { scroll-margin-top: 60px; }

  .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--bg2);
    border: 0.5px solid var(--border);
    color: var(--hint);
    font-family: 'JetBrains Mono', var(--font-mono);
  }

  .no-results { text-align: center; padding: 40px; color: var(--hint); font-size: 14px; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">⬡ AWS Solutions Architect</div>
  <h1>AWS Service Reference Guide</h1>
  <p>Comprehensive architecture patterns, cost optimization, and trade-offs for every major AWS service category.</p>
  <div class="hero-stats">
    <div class="hero-stat"><strong>12</strong>Categories</div>
    <div class="hero-stat"><strong>40+</strong>Services</div>
    <div class="hero-stat"><strong>120+</strong>Cost Tips</div>
    <div class="hero-stat"><strong>60+</strong>Trade-off Tables</div>
  </div>
</div>

<div class="sticky-nav">
  <div class="jump-bar" id="jumpBar"></div>
</div>

<div class="toc-section">
  <h2>Table of Contents</h2>
  <div class="toc-grid" id="tocGrid"></div>
</div>

<div class="search-bar">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--hint);flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
  <input type="text" placeholder="Search services, categories, use cases..." id="searchInput" oninput="filterServices(this.value)">
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" onclick="setFilter('all',this)">All Services</button>
  <button class="filter-btn badge-trap" onclick="setFilter('trap',this)">⚠️ Cost Traps</button>
  <button class="filter-btn badge-champ" onclick="setFilter('champ',this)">✅ Cost Champions</button>
</div>

<div id="servicesContainer"></div>

<div id="cheatSheet"></div>
<div id="decisionFlow"></div>

<script>
const CATEGORIES = [
  { id: 'compute', icon: '⚡', name: 'Compute' },
  { id: 'storage', icon: '💾', name: 'Storage' },
  { id: 'database', icon: '🗄️', name: 'Database' },
  { id: 'networking', icon: '🌐', name: 'Networking' },
  { id: 'security', icon: '🔐', name: 'Security & Identity' },
  { id: 'messaging', icon: '📨', name: 'Messaging & Integration' },
  { id: 'analytics', icon: '📊', name: 'Analytics & Big Data' },
  { id: 'devops', icon: '🔧', name: 'Developer & DevOps' },
  { id: 'monitoring', icon: '🔍', name: 'Monitoring & Management' },
  { id: 'aiml', icon: '🤖', name: 'AI / ML' },
  { id: 'edge', icon: '🌍', name: 'Edge & IoT' },
  { id: 'migration', icon: '🚚', name: 'Migration' },
];

const SERVICES = [
  // COMPUTE
  {
    id: 'ec2', cat: 'compute', name: 'EC2', sub: 'Elastic Compute Cloud',
    trap: true, champ: false,
    tags: ['vm','instances','auto-scaling','spot'],
    what: 'EC2 provides resizable virtual machines in the cloud — choose from 400+ instance types optimized for compute, memory, storage, or GPU workloads. You get full OS-level control with configurable networking, storage, and security groups. It forms the foundation for most lift-and-shift migrations.',
    scenario: '<strong>Scenario</strong>A SaaS company runs a REST API serving 50,000 daily users with traffic peaks at 2pm–4pm. They use an Auto Scaling Group behind an ALB: 3 baseline t3.medium On-Demand instances scale up to 12 during peaks. Spot instances handle burst compute at 70% savings. Monthly baseline cost: ~$180, peak overhead: ~$45.',
    arch: `<span class="hl">User Requests</span>
   ↓
<span class="blu">Route 53</span> (DNS) → <span class="grn">ALB</span> (Application Load Balancer)
   ↓
<span class="hl">Auto Scaling Group</span>
   ├── <span class="grn">On-Demand</span>: t3.medium × 3 (baseline)
   └── <span class="hl">Spot Fleet</span>: c5.xlarge × 0–9 (burst)
   ↓
<span class="blu">RDS</span> (Multi-AZ) + <span class="blu">ElastiCache</span> (read cache)`,
    costs: [
      'Use Compute Savings Plans (1-yr) for baseline: up to 66% off On-Demand. Combine with Spot for non-critical burst workloads.',
      'Right-size with AWS Compute Optimizer — teams routinely discover 40–60% of EC2 instances are >50% over-provisioned.',
      'Stop dev/staging EC2 instances nights/weekends with EventBridge Scheduler — saves ~65% on non-production spend.',
    ],
    alts: [
      { name: 'Lambda', when: 'Stateless, event-driven workloads < 15 min runtime', cost: 'cheaper' },
      { name: 'ECS Fargate', when: 'Containers without EC2 fleet management overhead', cost: 'pricier' },
      { name: 'Lightsail', when: 'Simple apps/blogs with predictable low traffic', cost: 'cheaper' },
    ],
  },
  {
    id: 'lambda', cat: 'compute', name: 'Lambda', sub: 'Serverless Functions',
    trap: false, champ: true,
    tags: ['serverless','functions','event-driven','pay-per-use'],
    what: 'Lambda runs code in response to events without provisioning or managing servers. You pay only for compute time consumed (per 100ms), with a generous 1M free requests/month. Supports Node.js, Python, Java, Go, Ruby, and custom runtimes.',
    scenario: '<strong>Scenario</strong>An e-commerce platform processes 5,000 order events/day via SQS. Each Lambda invocation (~500ms, 512MB) processes one order: validates, charges, triggers fulfillment. Monthly cost: ~$0.08. Equivalent EC2 (t3.micro): ~$7.50/mo idle. Lambda is 99% cheaper at this scale.',
    arch: `<span class="hl">SQS Queue</span> (order events)
   ↓ Event Source Mapping
<span class="grn">Lambda Function</span> (Node.js, 512MB, 15s timeout)
   ├── Validate order → <span class="blu">DynamoDB</span>
   ├── Charge card → <span class="hl">Stripe API</span>
   └── Trigger → <span class="grn">SNS</span> → Fulfillment Lambda`,
    costs: [
      'Use 128MB memory for simple I/O-bound tasks — Lambda bills on duration × memory. Don\'t over-allocate memory.',
      'Enable Lambda SnapStart for Java functions — reduces cold starts by up to 10x without extra cost.',
      'Set concurrency limits per function to avoid runaway invocations hitting expensive downstream APIs.',
    ],
    alts: [
      { name: 'EC2', when: 'Long-running workloads, stateful apps, > 15 min execution', cost: 'cheaper at scale' },
      { name: 'ECS Fargate', when: 'Containerized, needs > 10GB memory or > 6 vCPU', cost: 'pricier' },
      { name: 'App Runner', when: 'Persistent HTTP services without infra management', cost: 'same' },
    ],
  },
  {
    id: 'eks', cat: 'compute', name: 'EKS + Fargate', sub: 'Kubernetes Orchestration',
    trap: true, champ: false,
    tags: ['kubernetes','containers','k8s','microservices'],
    what: 'EKS is a managed Kubernetes control plane — AWS handles master nodes, upgrades, and HA. Fargate removes the need to manage EC2 worker nodes by running pods serverlessly. Ideal for large microservice platforms needing fine-grained scheduling and the Kubernetes ecosystem.',
    scenario: '<strong>Scenario</strong>A fintech startup runs 40 microservices, processing 8,000 req/sec peak. EKS on EC2 Spot + On-Demand nodes: $280/mo cluster + $640/mo nodes. Pure Fargate: $1,100/mo — simpler ops but 70% pricier. They use EKS with Karpenter autoscaler + 80% Spot.',

let currentFilter = 'all';
let currentSearch = '';

function setFilter(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderServices();
}

function filterServices(query) {
  currentSearch = query.toLowerCase();
  renderServices();
}

function scrollToSection(id) {
  const el = document.getElementById('cat-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth' });
}

function toggleCard(cardId) {
  const header = document.getElementById('hdr-' + cardId);
  const body = document.getElementById('bdy-' + cardId);
  header.classList.toggle('open');
  body.classList.toggle('open');
}

function switchTab(cardId, tabName) {
  const tabs = document.querySelectorAll(`[data-card="${cardId}"].tab`);
  const panels = document.querySelectorAll(`[data-card="${cardId}"].tab-panel`);
  tabs.forEach(t => { t.classList.toggle('active', t.dataset.tab === tabName); });
  panels.forEach(p => { p.classList.toggle('active', p.dataset.tab === tabName); });
}

function buildArch(raw) {
  return raw
    .replace(/<span class="hl">(.*?)<\/span>/g, '<span class="hl">$1</span>')
    .replace(/<span class="grn">(.*?)<\/span>/g, '<span class="grn">$1</span>')
    .replace(/<span class="blu">(.*?)<\/span>/g, '<span class="blu">$1</span>');
}

function renderServices() {
  const container = document.getElementById('servicesContainer');
  let html = '';

  const filteredCats = CATEGORIES.filter(cat => {
    const catServices = SERVICES.filter(s => {
      if (s.cat !== cat.id) return false;
      if (currentFilter === 'trap' && !s.trap) return false;
      if (currentFilter === 'champ' && !s.champ) return false;
      if (currentSearch) {
        const text = (s.name + s.sub + s.tags.join(' ') + s.what + s.scenario).toLowerCase();
        if (!text.includes(currentSearch)) return false;
      }
      return true;
    });
    return catServices.length > 0;
  });

  if (filteredCats.length === 0) {
    html = '<div class="no-results">No services match your filter. Try a different search or filter.</div>';
    container.innerHTML = html;
    return;
  }

  filteredCats.forEach(cat => {
    const catServices = SERVICES.filter(s => {
      if (s.cat !== cat.id) return false;
      if (currentFilter === 'trap' && !s.trap) return false;
      if (currentFilter === 'champ' && !s.champ) return false;
      if (currentSearch) {
        const text = (s.name + s.sub + s.tags.join(' ') + s.what + s.scenario).toLowerCase();
        if (!text.includes(currentSearch)) return false;
      }
      return true;
    });

    html += `<div class="category-block section-anchor" id="cat-${cat.id}">
      <div class="cat-header">
        <div class="cat-icon">${cat.icon}</div>
        <div class="cat-title">${cat.name}</div>
        <div class="cat-count">${catServices.length} service${catServices.length !== 1 ? 's' : ''}</div>
      </div>`;

    catServices.forEach(svc => {
      const badges = [];
      if (svc.trap) badges.push(`<span class="badge badge-trap">⚠️ Cost Trap</span>`);
      if (svc.champ) badges.push(`<span class="badge badge-champ">✅ Cost Champion</span>`);

      const altsRows = svc.alts.map(a => {
        const costClass = a.cost.includes('cheaper') ? 'cheaper' : (a.cost.includes('pricier') ? 'pricier' : 'same');
        return `<tr>
          <td><span class="svc-tag">${a.name}</span></td>
          <td>${a.when}</td>
          <td class="${costClass}">${a.cost}</td>
        </tr>`;
      }).join('');

      const costItems = svc.costs.map((c, i) => `
        <li>
          <span class="cost-dot">${i+1}</span>
          <span>${c}</span>
        </li>`).join('');

      const tagHtml = svc.tags.map(t => `<span class="tag">${t}</span>`).join('');

      html += `
      <div class="service-card">
        <div class="card-header" id="hdr-${svc.id}" onclick="toggleCard('${svc.id}')">
          <div>
            <div class="svc-name">${svc.name} <span class="svc-sub">— ${svc.sub}</span></div>
          </div>
          ${badges.join('')}
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div class="card-body" id="bdy-${svc.id}">
          <div class="tabs">
            <div class="tab active" data-card="${svc.id}" data-tab="overview" onclick="switchTab('${svc.id}','overview')">Overview</div>
            <div class="tab" data-card="${svc.id}" data-tab="arch" onclick="switchTab('${svc.id}','arch')">Architecture</div>
            <div class="tab" data-card="${svc.id}" data-tab="costs" onclick="switchTab('${svc.id}','costs')">Cost Tips</div>
            <div class="tab" data-card="${svc.id}" data-tab="alts" onclick="switchTab('${svc.id}','alts')">Alternatives</div>
          </div>

          <div class="tab-panel active" data-card="${svc.id}" data-tab="overview">
            <div class="what-box">${svc.what}</div>
            <div style="margin-top:10px"></div>
            <div class="scenario-box">${svc.scenario}</div>
            <div class="tag-row">${tagHtml}</div>
          </div>

          <div class="tab-panel" data-card="${svc.id}" data-tab="arch">
            <div class="arch-flow">${buildArch(svc.arch)}</div>
          </div>

          <div class="tab-panel" data-card="${svc.id}" data-tab="costs">
            <ul class="cost-tips">${costItems}</ul>
          </div>

          <div class="tab-panel" data-card="${svc.id}" data-tab="alts">
            <table class="alt-table">
              <thead><tr><th>Alternative</th><th>When to choose it</th><th>Cost vs ${svc.name}</th></tr></thead>
              <tbody>${altsRows}</tbody>
            </table>
          </div>
        </div>
      </div>`;
    });

    html += `</div>`;
  });

  container.innerHTML = html;
}

function renderOverlaps() {
  let html = `<div style="margin-bottom:28px">
    <div style="font-family:'Syne',var(--font-sans);font-size:16px;font-weight:700;margin-bottom:14px;padding-bottom:10px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:8px">
      🔀 Service Overlap Decision Guide
    </div>`;

  OVERLAPS.forEach(ov => {
    html += `<div class="overlap-box">
      <h3>🔀 ${ov.title}</h3>
      <div class="overlap-grid">`;
    ov.items.forEach(item => {
      html += `<div class="overlap-item">
        <h4>${item.name}</h4>
        <p>${item.desc}</p>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;
  return html;
}

    </div>
    <div class="cheat-body" style="font-size:13px;line-height:1.8;color:var(--muted)">
      <p>🔴 <strong style="color:var(--text)">EC2/RDS → Internet</strong>: $0.09/GB — the most expensive egress. Use CloudFront ($0.0085/GB) to front any public-facing content.</p>
      <p>🔴 <strong style="color:var(--text)">Cross-Region transfer</strong>: $0.02/GB — avoid cross-region architectures for high-bandwidth workloads unless required for DR/compliance.</p>
      <p>🟡 <strong style="color:var(--text)">Cross-AZ transfer</strong>: $0.01/GB — keep app and database tiers in the same AZ for high-bandwidth internal traffic.</p>
      <p>🟡 <strong style="color:var(--text)">NAT Gateway</strong>: $0.045/GB + $0.045/hr — use VPC Endpoints for S3 and DynamoDB (free) to bypass NAT.</p>
      <p>🟢 <strong style="color:var(--text)">Same-AZ transfer</strong>: Free. Same-region S3 to EC2: Free. CloudFront to S3: Free.</p>
      <p>🟢 <strong style="color:var(--text)">Inbound internet → AWS</strong>: Free. Free Transfer: between AWS services in same region and AZ.</p>
    </div>
  </div>

  <div class="cheat-section">
    <div class="cheat-header">
      <div style="font-size:18px">⚠️</div>
      <h3>Top 5 Most Over-Provisioned Services & Fixes</h3>

    <div class="cheat-body">
      <table class="decision-matrix">
        <thead><tr><th>#</th><th>Service</th><th>Common Waste</th><th>Fix</th></tr></thead>
        <tbody>
          <tr><td style="color:var(--aws-orange);font-weight:700">1</td><td>EC2</td><td>40–60% oversized; dev instances running 24/7</td><td>Compute Optimizer + Savings Plans + auto-shutdown schedules</td></tr>
          <tr><td style="color:var(--aws-orange);font-weight:700">2</td><td>RDS / Aurora</td><td>Multi-AZ in dev; oversized instances; unused read replicas</td><td>Single-AZ in dev; Reserved Instances; right-size with Performance Insights</td></tr>
          <tr><td style="color:var(--aws-orange);font-weight:700">3</td><td>NAT Gateway</td><td>All private EC2 traffic routing through NAT to S3/DynamoDB</td><td>Add VPC Gateway Endpoints for S3 and DynamoDB (free, saves $0.045/GB)</td></tr>
          <tr><td style="color:var(--aws-orange);font-weight:700">4</td><td>CloudWatch Logs</td><td>Lambda/ECS verbose debug logs in prod with no retention policy</td><td>Set 30–90 day retention; filter log level at source; export to S3</td></tr>
          <tr><td style="color:var(--aws-orange);font-weight:700">5</td><td>EBS gp2 Volumes</td><td>Legacy gp2 volumes (20% pricier than gp3 with fewer features)</td><td>Migrate all gp2 → gp3 (free, same or better performance, 20% cheaper)</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  `;
}

// Build TOC
function buildTOC() {
  const grid = document.getElementById('tocGrid');
  const jump = document.getElementById('jumpBar');

  CATEGORIES.forEach((cat, i) => {
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.innerHTML = `<span class="toc-num">${i+1}</span>${cat.icon} ${cat.name}`;
    item.onclick = () => scrollToSection(cat.id);
    grid.appendChild(item);

    const btn = document.createElement('button');
    btn.className = 'jump-btn';
    btn.textContent = cat.name;
    btn.onclick = () => scrollToSection(cat.id);
    jump.appendChild(btn);
  });

  // Add cheat sheet link
  const csItem = document.createElement('div');
  csItem.className = 'toc-item';
  csItem.innerHTML = `<span class="toc-num">💰</span>💡 Cost Cheat Sheet`;
  csItem.onclick = () => document.getElementById('cheatSheet').scrollIntoView({behavior:'smooth'});
  grid.appendChild(csItem);
}
